<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБРІЙ Admin</title>
    <link rel="icon" type="image/png" href="assets/images/logo_new.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2.2">
    <style>
        body {
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--vp-c-bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .admin-panel {
            display: none;
            padding: 40px 0;
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--vp-c-text-2);
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--vp-c-brand);
            outline: none;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            border-radius: 8px;
        }

        .editor-btn {
            background: var(--vp-c-bg);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-btn:hover {
            border-color: var(--vp-c-brand);
            color: var(--vp-c-brand);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--vp-c-bg-alt);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid var(--vp-c-border);
        }

        .preview-box {
            padding: 24px;
            background: var(--vp-c-bg-alt);
            border-radius: 12px;
            border: 1px solid var(--vp-c-border);
            margin-top: 24px;
            min-height: 200px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--vp-c-bg-alt);
            border-radius: 16px;
            border: 1px solid var(--vp-c-border);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--vp-c-border);
            padding-bottom: 1px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: var(--vp-c-text-2);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--vp-c-brand);
            border-bottom-color: var(--vp-c-brand);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        /* Override global header styles for Admin to prevent layer issues */
        .admin-panel header {
            position: static;
            height: auto;
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
        }

        /* Quill Editor Dark Mode Overrides */
        .ql-toolbar.ql-snow {
            border-color: var(--vp-c-border) !important;
            background: var(--vp-c-bg-soft);
        }
        .ql-container.ql-snow {
            border-color: var(--vp-c-border) !important;
            background: var(--vp-c-bg-alt);
            color: var(--vp-c-text-1);
            font-family: 'Inter', sans-serif !important;
            font-size: 16px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .ql-toolbar.ql-snow .ql-stroke {
            stroke: var(--vp-c-text-2) !important;
        }
        .ql-toolbar.ql-snow .ql-fill {
            fill: var(--vp-c-text-2) !important;
        }
        .ql-toolbar.ql-snow .ql-picker {
            color: var(--vp-c-text-2) !important;
        }
        
        /* Preview Modal */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: none;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .preview-content {
            background: var(--vp-c-bg); /* Use site bg */
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            position: relative;
        }
        /* Image Control Overlay */
        #imageOverlay {
            position: absolute;
            border: 2px solid var(--vp-c-brand);
            pointer-events: none; /* Let clicks pass unless on handles */
            display: none;
            z-index: 50;
        }

        .resize-handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--vp-c-brand);
            border: 1px solid #fff;
            pointer-events: auto; /* Enable interaction */
        }
        .rh-nw { top: -6px; left: -6px; cursor: nw-resize; }
        .rh-ne { top: -6px; right: -6px; cursor: ne-resize; }
        .rh-sw { bottom: -6px; left: -6px; cursor: sw-resize; }
        .rh-se { bottom: -6px; right: -6px; cursor: se-resize; }

        .img-btn {
            background: var(--vp-c-bg-alt);
            color: var(--vp-c-text-1);
            border: 1px solid var(--vp-c-border);
            border-radius: 4px;
            width: 28px;
            height: 28px;
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }
        .img-btn:hover { border-color: var(--vp-c-brand); color: var(--vp-c-brand); }
        .btn-del:hover { background: #ff4d4d; color: white; border-color: #ff4d4d; }
        
        /* List Item Hover */
        .list-item:hover {
            border-color: var(--vp-c-text-2) !important;
            background: var(--vp-c-bg-soft) !important;
        }
        .list-item button:hover {
            color: #ff4d4d !important;
        }

        /* Crop Modal (Fullscreen) */
        #cropModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 99999; /* Topmost */
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #cropContainer {
            max-width: 90%;
            max-height: 80vh;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        #cropImage {
            max-width: 100%;
            display: block; /* Required for Cropper.js */
        }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 20px 0;
        }
        .gallery-item {
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s;
        }
        .gallery-item:hover img { transform: scale(1.05); }
        .gallery-actions {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: space-around;
            padding: 8px;
            opacity: 0; transition: opacity 0.2s;
        }
        .gallery-item:hover .gallery-actions { opacity: 1; }
        .gallery-btn {
            background: none; border: none; color: white; cursor: pointer;
            font-size: 16px; opacity: 0.8;
            transition: transform 0.2s;
        }
        .gallery-btn:hover { opacity: 1; transform: scale(1.1); }

    </style>
    <!-- Quill CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Cropper.js CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
</head>

<body>
    <!-- Crop Modal -->
    <div id="cropModal">
        <div id="cropContainer">
            <img id="cropImage" src="">
        </div>
        
        <div style="margin-top: 20px; display: flex; gap: 16px;">
            <button class="btn btn-primary" onclick="confirmCrop()" id="confirmCropBtn"><i class="fas fa-check"></i> Обрізати та Зберегти</button>
            <button class="btn btn-outline" style="background:transparent; color:white; border:1px solid white;" onclick="cancelCrop()"><i class="fas fa-times"></i> Скасувати</button>
        </div>
    </div>

    <!-- Auth Overlay -->
    <div class="login-overlay" id="authOverlay">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 24px;">
                <img src="assets/images/logo_new.png" alt="Logo" style="height: 50px; margin-bottom: 16px;">
                <h2>Вхід в Адмінку</h2>
                <p style="color: var(--vp-c-text-2); font-size: 14px;">Введіть пароль адміністратора</p>
            </div>
            
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="••••••••">
            </div>
            


            <button onclick="authenticateGithub()" class="btn btn-primary" id="loginBtn" style="width: 100%;">Увійти</button>
            <p id="authError" style="color: #ff4d4d; margin-top: 16px; text-align: center; display: none;"></p>
        </div>
    </div>

    <!-- Image Overlay (Resize/Delete/Crop) -->
    <div id="imageOverlay">
        <div class="resize-handle rh-nw" data-dir="nw"></div>
        <div class="resize-handle rh-ne" data-dir="ne"></div>
        <div class="resize-handle rh-sw" data-dir="sw"></div>
        <div class="resize-handle rh-se" data-dir="se"></div>
        
        <!-- Action Buttons -->
        <div style="position: absolute; top: -12px; right: -70px; display: flex; gap: 4px;">
            <button class="img-btn btn-crop" onclick="startCrop()" title="Crop"><i class="fas fa-crop-alt"></i></button>
            <button class="img-btn btn-del" onclick="deleteSelectedImage()" title="Delete"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <!-- Fullscreen Drop Zone REMOVED -->
    
    <!-- Main Interface -->
    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <header style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
                <div class="logo">
                    <img src="assets/images/logo_new.png" alt="Logo">
                    <span style="font-weight:700; font-size:20px;">ADMIN</span>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="text-align: right; font-size: 13px; color: var(--vp-c-text-2);">
                        <div id="displayUser">User</div>
                        <div id="displayRepo" style="opacity: 0.7;">Repo</div>
                    </div>
                    <button onclick="logout()" class="btn btn-outline"
                        style="border-color: #ff4d4d33; color: #ff4d4d;">Вийти</button>
                    <a href="index.html" class="btn btn-outline">На сайт</a>
                </div>
            </header>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('news')">Новини</button>
                <button class="tab-btn" onclick="switchTab('patrons')">Меценати (Донати)</button>
                <button class="tab-btn" onclick="switchTab('gallery')">Галерея</button>
            </div>

            <!-- Global Actions -->
            <div
                style="margin-bottom: 24px; padding: 16px; background: var(--vp-c-bg-soft); border-radius: 12px; display: flex; gap: 16px; align-items: center;">
                <button onclick="loadFromGitHub()" class="btn btn-outline"><i class="fas fa-sync"></i> Оновити поточну
                    вкладку</button>
                <div style="flex:1; text-align:center; color: var(--vp-c-text-3); font-size: 14px;" id="statusMsg">
                    Готовий до роботи</div>
                <button onclick="pushToGitHub()" class="btn btn-primary" style="background: #2ea44f; color: white;"><i
                        class="fas fa-cloud-upload-alt"></i> Зберегти поточну вкладку</button>
            </div>

            <!-- NEWS SECTION (INLINE EDITOR) -->
            <div id="newsSection" class="section-content active admin-inline-edit">
                 
                 <!-- Grid Layout: Editor (Left) | Sidebar (Right) -->
                 <div style="display: grid; grid-template-columns: 1fr 320px; gap: 32px; align-items: start;">
                     
                     <!-- LEFT: Editor Area -->
                     <div style="min-width: 0;"> <!-- min-width fix for grid overflow -->
                        
                        <!-- Actions Toolbar -->
                        <div style="margin-bottom: 24px; text-align: right;">
                           <button onclick="clearNewsForm()" class="btn btn-outline">Нова стаття</button>
                           <button onclick="saveLocalNews()" class="btn btn-primary">Зберегти</button>
                           <input type="hidden" id="newsId">
                           <input type="hidden" id="editIndex" value="-1">
                        </div>

                        <!-- Article Container -->
                        <div class="full-article" style="background: var(--vp-c-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--vp-c-border);">
                           
                           <div class="article-header" style="margin-bottom: 32px;">
                               <!-- Inline Title Input -->
                               <h1 style="margin-top:16px; margin-bottom:16px;">
                                   <input type="text" id="newsTitle" placeholder="Введіть заголовок статті..." autocomplete="off">
                               </h1>
                               
                               <!-- Inline Meta Inputs -->
                               <div class="news-meta" style="margin-bottom: 16px; color: var(--vp-c-text-2); display: flex; gap: 16px; align-items: center;">
                                   <div style="display: flex; align-items: center; gap: 8px;">
                                       <i class="far fa-calendar-alt"></i>
                                       <input type="text" id="newsDate" placeholder="DD.MM.YYYY" style="width: 120px;">
                                   </div>
                                   <div style="display: flex; align-items: center; gap: 8px; flex: 1;">
                                       <span style="font-weight: 600; color: var(--vp-c-brand);">#</span>
                                       <input type="text" id="newsTags" placeholder="теги, через, кому" style="color: var(--vp-c-brand);">
                                   </div>
                               </div>

                               <!-- Main Image Trigger -->
                               <div class="news-image" onclick="uploadTarget='cover'; document.getElementById('fileInput').click()" 
                                    style="height: 400px; border-radius: 12px; margin-bottom: 24px; overflow:hidden; background: var(--vp-c-bg-alt); display: flex; align-items: center; justify-content: center;">
                                   <img id="newsImagePreview" src="assets/images/logo_new.png" alt="Cover" style="width: 100%; height: 100%; object-fit: cover;">
                                   <input type="hidden" id="newsImage" value="assets/images/logo_new.png">
                               </div>
                           </div>

                           <!-- Quill Editor (Body) -->
                           <div class="article-content" style="color: var(--vp-c-text-1);">
                               <div id="editor-container"></div>
                           </div>
                       </div>
                    </div>

                    <!-- RIGHT: Sidebar List -->
                    <div style="position: sticky; top: 20px; max-height: calc(100vh - 40px); display: flex; flex-direction: column;">
                        <h3 style="margin-bottom: 12px; font-size: 18px;">Історія статей</h3>
                        
                        <!-- Search Input -->
                        <input type="text" id="newsSearch" placeholder="Пошук..." oninput="renderNews()" 
                               style="width: 100%; padding: 8px 12px; margin-bottom: 12px; background: var(--vp-c-bg-alt); border: 1px solid var(--vp-c-border); color: var(--vp-c-text-1); border-radius: 6px; font-size: 14px;">
                        
                        <!-- Scrollable List -->
                        <div id="newsList" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-right: 4px; flex: 1;"></div>
                    </div>

                 </div> <!-- End Grid -->
            </div>

            <!-- Hidden Controls -->
            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
            <div id="uploadStatus" style="text-align: right; font-size: 12px; color: var(--vp-c-text-2); margin-top: 8px;"></div>
            
            <!-- PATRONS SECTION -->
            <div id="patronsSection" class="section-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="margin-bottom: 24px;">Додати Мецената</h2>
                        <input type="hidden" id="pIndex" value="-1">
                        <div class="form-group"><label>Ім'я / Нікнейм</label><input type="text" id="pName"></div>
                        <div class="form-group"><label>Сума (наприклад: 500 ₴)</label><input type="text" id="pAmount">
                        </div>
                        <div class="form-group"><label>Повідомлення</label><textarea id="pMessage" rows="3"></textarea>
                        </div>
                        <div class="form-group"><label>Дата</label><input type="text" id="pDate"></div>
                        <div style="display: flex; gap: 12px;">
                            <button onclick="saveLocalPatron()" class="btn btn-primary" style="flex: 1;">Додати /
                                Оновити</button>
                            <button onclick="clearPatronForm()" class="btn btn-outline">Очистити</button>
                        </div>
                    </div>

                    <div>
                        <h2 style="margin-bottom: 24px;">Список Меценатів</h2>
                        <div id="patronsList"
                            style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- GALLERY SECTION -->
            <div id="gallerySection" class="section-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <div>
                        <h2 style="margin-bottom: 8px;">Менеджер зображень</h2>
                        <p style="color: var(--vp-c-text-2); font-size:14px;">Файли з теки <code>assets/images/uploads</code></p>
                    </div>
                    <button class="btn btn-primary" onclick="loadGallery()"><i class="fas fa-sync-alt"></i> Оновити список</button>
                </div>
                
                <div id="galleryContainer" class="gallery-grid">
                    <!-- Images will be injected here -->
                    <div style="grid-column: 1/-1; text-align: center; color: var(--vp-c-text-3);">
                        Натисніть "Оновити список", щоб завантажити файли.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // STATE
        let newsData = [];
        let patronsData = [];
        let newsSha = null;
        let patronsSha = null;
        let currentTab = 'news';
        let uploadTarget = 'cover';
        let quill; // Quill instance

        // INIT
        // INIT
        document.addEventListener('DOMContentLoaded', () => {
             // 1. Register Custom 'Info Box' Blot
             const Block = Quill.import('blots/block');
             class InfoBoxBlot extends Block {
                 static create(value) {
                     let node = super.create();
                     node.setAttribute('class', 'info-box');
                     return node;
                 }
                 static formats(node) {
                     return node.getAttribute('class');
                 }
             }
             InfoBoxBlot.blotName = 'info-box';
             InfoBoxBlot.tagName = 'div';
             Quill.register(InfoBoxBlot);
             
             // 2. Add Custom Icon to Toolbar
             const icons = Quill.import('ui/icons');
             icons['info-box'] = '<i class="fas fa-lightbulb" style="color:#ffd700; font-weight:bold;"></i>';

            // Init Quill with custom Toolbar
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: {
                        container: [
                            [{ 'header': [2, 3, false] }],
                            ['bold', 'italic', 'underline', 'strike'],
                            ['link', 'image', 'video'],
                            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                            ['info-box'], // Custom Button
                            ['clean']
                        ],
                        handlers: {
                            'info-box': function() {
                                const format = this.quill.getFormat();
                                if (format['info-box']) {
                                    this.quill.format('info-box', false); // Remove
                                } else {
                                    this.quill.format('info-box', true); // Add
                                }
                            }
                        }
                    }
                }
            });

            // Custom Image Handler for Quill to use GitHub upload
            const toolbar = quill.getModule('toolbar');
            toolbar.addHandler('image', () => {
                uploadTarget = 'content-quill';
                document.getElementById('fileInput').click();
            });

            const u = localStorage.getItem('admin_pass');
            if (u) {
                document.getElementById('adminPass').value = u;
                console.log('Auto-login triggered with password:', u.substring(0,3)+'***');
                document.getElementById('loginBtn').innerText = 'Авто-вхід...';
                authenticateGithub();
            }
            document.getElementById('newsDate').value = new Date().toLocaleDateString('uk-UA');
            document.getElementById('pDate').value = new Date().toLocaleDateString('uk-UA');
        });

        // ... existing TABS ...
        function switchTab(tab) {
             currentTab = tab;
             document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
             document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

             // Find button text to set active? Or rely on onclick
             // Actually, we need to find the specific button index or ID.
             // Simplest way: loop and match text or index.
             // But simpler: just add IDs to buttons in HTML upgrade above?
             // Or easier: pass 'this' (event.target) to function? No, we call it manually too.
             // Let's rely on text textContent mapping or just:
             const index = ['news', 'patrons', 'gallery'].indexOf(tab);
             if (index !== -1) {
                 document.querySelectorAll('.tab-btn')[index].classList.add('active');
             }

             document.getElementById(tab + 'Section').classList.add('active');

             if (tab === 'news' && newsData.length === 0) loadTabFile('news.json');
             if (tab === 'patrons' && patronsData.length === 0) loadTabFile('patrons.json');
             if (tab === 'gallery') loadGallery();
        }

        // GALLERY LOGIC
        async function loadGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px;">Завантаження... <i class="fas fa-spinner fa-spin"></i></div>';
            
            try {
                const pass = localStorage.getItem('admin_pass');
                const path = 'assets/images/uploads';
                
                // Use the Worker to fetch directory listing
                const res = await fetch(`${WORKER_URL}?path=${path}`, {
                    headers: { 'x-admin-password': pass }
                });

                if (!res.ok) throw new Error(await res.text());

        // 2. Resize Logic
        let isResizing = false;
        let startX, startY, startWidth, startHeight, ratio;

        document.querySelectorAll('.resize-handle').forEach(handle => {
            handle.addEventListener('mousedown', initResize);
        });

        function initResize(e) {
            if (!selectedImg) return;
            e.preventDefault();
            e.stopPropagation();
            
            isResizing = true;
            startX = e.clientX;
            startY = e.clientY;
            startWidth = selectedImg.offsetWidth;
            startHeight = selectedImg.offsetHeight;
            ratio = startWidth / startHeight; // Calculate Aspect Ratio
            
            const handle = e.target;
            const dir = handle.getAttribute('data-dir'); // nw, ne, sw, se

            const onMouseMove = (moveEvent) => {
                if (!isResizing) return;
                
                const dx = moveEvent.clientX - startX;
                // We mainly drive by Width to keep it simple and responsive
                // Height will adjust automatically via CSS
                
                let newW = startWidth;
                
                // Logic based on handle direction (Width focus)
                if (dir.includes('e')) newW = startWidth + dx;
                if (dir.includes('w')) newW = startWidth - dx;

                if (newW < 50) newW = 50; // Min width

                selectedImg.style.width = newW + 'px';
                selectedImg.style.height = 'auto'; // Force auto height to maintain ratio
                
                updateOverlayPosition();
            };

            const onMouseUp = () => {
                isResizing = false;
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
                
                // Persist changes
                // We set width explicitly, and remove height to let browser handle ratio
                selectedImg.setAttribute('width', selectedImg.style.width);
                selectedImg.removeAttribute('height'); 
                
                quill.update();
            };

            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        }

        document.addEventListener('DOMContentLoaded', () => {
             // 1. Setup Custom Caret (Visual Indicator)
             const caretEl = document.createElement('div');
             caretEl.id = 'dragCaret';
             Object.assign(caretEl.style, {
                 position: 'fixed',
                 height: '2px', // Horizontal Line
                 width: '100%',
                 backgroundColor: '#00fa9a',
                 zIndex: '10000',
                 display: 'none',
                 pointerEvents: 'none',
                 boxShadow: '0 0 8px #00fa9a',
                 transition: 'top 0.05s' // Smooth vertical movement
             });
             document.body.appendChild(caretEl);

             // 2. Prevent browser opening files on global drop
             window.addEventListener('dragover', e => e.preventDefault(), false);
             window.addEventListener('drop', e => e.preventDefault(), false);
             // Hide caret on global interactions
             window.addEventListener('dragleave', () => { caretEl.style.display = 'none'; });
             window.addEventListener('drop', () => { caretEl.style.display = 'none'; });

             const editorDiv = document.querySelector('.ql-editor');
             if (editorDiv) {
                 // 3. Handle Drag Over: Move Custom Caret
                 editorDiv.addEventListener('dragover', (e) => {
                     e.preventDefault(); 
                     
                     let range = null;
                     let rect = null;

                     // Standard (Firefox/Gecko)
                     if (document.caretPositionFromPoint) {
                         const point = document.caretPositionFromPoint(e.clientX, e.clientY);
                         if (point) {
                             range = document.createRange();
                             range.setStart(point.offsetNode, point.offset);
                             range.collapse(true);
                         }
                     } 
                     // WebKit (Chrome/Safari)
                     else if (document.caretRangeFromPoint) {
                         range = document.caretRangeFromPoint(e.clientX, e.clientY);
                     }

                     if (range) {
                         // Correctly position the visual indicator
                         const rects = range.getClientRects();
                         if (rects.length > 0) {
                             rect = rects[0];
                             const editorRect = editorDiv.getBoundingClientRect();
                             
                             // Horizontal Line Logic
                             caretEl.style.width = editorRect.width + 'px';
                             caretEl.style.left = editorRect.left + 'px';
                             caretEl.style.top = rect.top + 'px'; // Snap to top of the line
                             caretEl.style.display = 'block';
                             
                             // Also sync internal selection so drop knows where to go
                             const blot = Quill.find(range.startContainer, true);
                             if (blot) {
                                 const offset = blot.offset(quill.scroll);
                                 const dragIndex = offset + range.startOffset;
                                 quill.setSelection(dragIndex, 0, 'silent');
                             }
                         }
                     }
                 });

                 // 4. Handle Drop
                 editorDiv.addEventListener('drop', async (e) => {
                     e.preventDefault();
                     e.stopPropagation();
                     caretEl.style.display = 'none';

                     const files = e.dataTransfer.files;
                     if (files && files.length > 0) {
                         const file = files[0];
                         if (file.type.startsWith('image/')) {
                             const status = document.getElementById('uploadStatus');
                             status.innerHTML = 'Завантаження картинки...';
                             
                             try {
                                 const url = await performUpload(file);
                                 const range = quill.getSelection(true) || { index: quill.getLength() };
                                 quill.insertEmbed(range.index, 'image', url);
                                 quill.setSelection(range.index + 1, 0);
                                 status.innerHTML = 'Картинка додана!';
                             } catch (err) {
                                 console.error(err);
                                 status.innerHTML = 'Помилка: ' + err.message;
                                 alert('Не вдалося завантажити: ' + err.message);
                             }
                         }
                     }
                 });
             }
        });

        // (Helper function removed as it is now inline or unused)

        // Unified Upload Logic via Worker (Uses admin_pass, no Token needed)
        async function performUpload(file) {
            // Remove special chars to avoid URL issues
            const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const path = `assets/images/uploads/${Date.now()}_${cleanName}`;
            
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = async () => {
                    // Get base64 content
                    const rawBase64 = reader.result.split(',')[1];
                    
                    try {
                        const pass = localStorage.getItem('admin_pass');
                        if (!pass) throw new Error('Немає пароля адміністратора. Перезайдіть.');

                        // Add debug query param to bypass cache if needed? No.
                        const res = await fetch(`${WORKER_URL}?path=${path}`, {
                            method: 'PUT',
                            headers: { 
                                'Content-Type': 'application/json',
                                'x-admin-password': pass
                            },
                            body: JSON.stringify({
                                message: 'Upload image via Admin Panel',
                                content: rawBase64
                            })
                        });
                        
                        if (!res.ok) throw new Error(await res.text());
                        const json = await res.json();
                        
                        // Construct URL
                        // The worker usually returns GitHub API response which has content.download_url
                        let rawUrl = '';
                        if (json.content && json.content.download_url) {
                            rawUrl = json.content.download_url;
                        } else {
                            // Fallback construction
                            const user = 'BodyFoder';
                            const repo = 'obriy_hytale_site';
                            rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${path}`;
                        }
                        
                        resolve(rawUrl);
                    } catch (e) { reject(e); }
                };
                reader.readAsDataURL(file);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {

             if (editorDiv) {

             // Also allow dropping on the main container

        async function handleDrop(e) {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                const file = files[0];
                if (file.type.startsWith('image/')) {
                    // Calculate precise index from drop coordinates
                    let index = quill.getLength(); // Default to end
                    
                    if (document.caretRangeFromPoint) {
                        const range = document.caretRangeFromPoint(e.clientX, e.clientY);
                        if (range) {
                            const blot = Quill.find(range.startContainer);
                            if (blot) {
                                index = blot.offset(quill.scroll) + range.startOffset;
                            }
                        }
                    } else if (document.caretPositionFromPoint) {
                        const range = document.caretPositionFromPoint(e.clientX, e.clientY);
                        if (range) {
                            const blot = Quill.find(range.offsetNode);
                            if (blot) {
                                index = blot.offset(quill.scroll) + range.offset;
                            }
                        }
                    }

                    const status = document.getElementById('uploadStatus');
                    status.innerHTML = 'Uploading dropped image...';
                    
                    try {
                        const url = await performUpload(file);
                        // Insert at calculated index
                        quill.insertEmbed(index, 'image', url);
                        // Fix cursor position
                        quill.setSelection(index + 1);
                        status.innerHTML = 'Image inserted!';
                    } catch (err) {
                        status.innerHTML = 'Error: ' + err.message;
                    }
                }
            }
        }

            // We need tokens. If not stored (because simple auth), we might need to prompt or use existing flow.

            // In original code: const token = localStorage.getItem('gh_token');
            // But we only have 'admin_pass' in new auth system.
            // Ah, the `uploadFile` function in previous steps used localStorage items that might not exist in the new "Simple Admin" flow.
            // The simple admin flow passes `x-admin-password` to the WORKER.
            // So we must upload VIA THE WORKER, not direct to GitHub API, unless we expose the token.
            // Let's check `pushToGitHub`. It uses the Worker.
            // We should implement `server-side upload` in the worker or (easier) 
            // rely on the user having the token or just use Base64 if small?
            // No, the previous uploadFile code was:
            /*
            async function uploadFile() {
                const user = localStorage.getItem('gh_user'); ...
            */
            // If the user hasn't set 'gh_user' etc, this fails. 
            // Since we are upgrading, let's make it robust. 
            // We will Try to use the Worker for upload if feasible, or ask user for token if missing.
            // Actually, for now, let's assume the user has configured it OR we use the Worker proxy.
            
            // To allow image uploads without exposing token in JS, we need a Worker endpoint for it.
            // Since I cannot edit the Worker right now (I can, but task scope?), 
            // I will use a clever trick: The worker supports PUT.
            // generic PUT path? `assets/images/uploads/...`
            
            const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
            const path = `assets/images/uploads/${Date.now()}_${cleanName}`;
            
            const reader = new FileReader();
            return new Promise((resolve, reject) => {
                reader.onload = async () => {
                    const contentBase64 = reader.result.split(',')[1];
                    try {
                        const pass = localStorage.getItem('admin_pass');
                        const res = await fetch(`${WORKER_URL}?path=${path}`, {
                            method: 'PUT',
                            headers: { 
                                'Content-Type': 'application/json',
                                'x-admin-password': pass
                            },
                            body: JSON.stringify({
                                message: 'Upload image via Admin DnD',
                                content: contentBase64
                            })
                        });
                        
                        if (!res.ok) throw new Error(await res.text());
                        const json = await res.json();
                        // Construct URL. JSON returns content.download_url usually?
                        // Worker returns GitHub response.
                        // If we can't get exact URL, guess it.
                        // Raw URL pattern:
                        const rawUrl = json.content ? json.content.download_url : `https://raw.githubusercontent.com/BodyFoder/obriy_hytale_site/main/${path}`;
                        resolve(rawUrl);
                    } catch (e) { reject(e); }
                };
                reader.readAsDataURL(file);
            });
        }
