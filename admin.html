<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБРІЙ Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1.2">
    <style>
        body {
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--vp-c-bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .admin-panel {
            display: none;
            padding: 40px 0;
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--vp-c-text-2);
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--vp-c-brand);
            outline: none;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            border-radius: 8px;
        }

        .editor-btn {
            background: var(--vp-c-bg);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-btn:hover {
            border-color: var(--vp-c-brand);
            color: var(--vp-c-brand);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--vp-c-bg-alt);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid var(--vp-c-border);
        }

        .preview-box {
            padding: 24px;
            background: var(--vp-c-bg-alt);
            border-radius: 12px;
            border: 1px solid var(--vp-c-border);
            margin-top: 24px;
            min-height: 200px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--vp-c-bg-alt);
            border-radius: 16px;
            border: 1px solid var(--vp-c-border);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--vp-c-border);
            padding-bottom: 1px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: var(--vp-c-text-2);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--vp-c-brand);
            border-bottom-color: var(--vp-c-brand);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        /* Override global header styles for Admin to prevent overlap */
        .admin-panel header {
            position: static;
            height: auto;
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
        }
    </style>
</head>

<body>

    <!-- Auth Overlay -->
    <div class="login-overlay" id="authOverlay">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 24px;">
                <img src="assets/images/logo_new.png" alt="Logo" style="height: 50px; margin-bottom: 16px;">
                <h2>Вхід в Адмінку</h2>
                <p style="color: var(--vp-c-text-2); font-size: 14px;">Введіть дані GitHub для доступу</p>
            </div>
            <div class="form-group"><label>GitHub Username</label><input type="text" id="ghUserIn"></div>
            <div class="form-group"><label>Repo Name</label><input type="text" id="ghRepoIn"></div>
            <div class="form-group"><label>Personal Access Token</label><input type="password" id="ghTokenIn"></div>
            <button onclick="authenticateGithub()" class="btn btn-primary" id="loginBtn"
                style="width: 100%;">Підключитися</button>
            <p id="authError" style="color: #ff4d4d; margin-top: 16px; text-align: center; display: none;"></p>
        </div>
    </div>

    <!-- Main Interface -->
    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <header style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
                <div class="logo">
                    <img src="assets/images/logo_new.png" alt="Logo">
                    <span style="font-weight:700; font-size:20px;">ADMIN</span>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="text-align: right; font-size: 13px; color: var(--vp-c-text-2);">
                        <div id="displayUser">User</div>
                        <div id="displayRepo" style="opacity: 0.7;">Repo</div>
                    </div>
                    <button onclick="logout()" class="btn btn-outline"
                        style="border-color: #ff4d4d33; color: #ff4d4d;">Вийти</button>
                    <a href="index.html" class="btn btn-outline">На сайт</a>
                </div>
            </header>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('news')">Новини</button>
                <button class="tab-btn" onclick="switchTab('patrons')">Меценати (Донати)</button>
            </div>

            <!-- Global Actions -->
            <div
                style="margin-bottom: 24px; padding: 16px; background: var(--vp-c-bg-soft); border-radius: 12px; display: flex; gap: 16px; align-items: center;">
                <button onclick="loadFromGitHub()" class="btn btn-outline"><i class="fas fa-sync"></i> Оновити поточну
                    вкладку</button>
                <div style="flex:1; text-align:center; color: var(--vp-c-text-3); font-size: 14px;" id="statusMsg">
                    Готовий до роботи</div>
                <button onclick="pushToGitHub()" class="btn btn-primary" style="background: #2ea44f; color: white;"><i
                        class="fas fa-cloud-upload-alt"></i> Зберегти поточну вкладку</button>
            </div>

            <!-- NEWS SECTION -->
            <div id="newsSection" class="section-content active">
                <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;">
                    <div>
                        <h2 style="margin-bottom: 24px;">Редактор Новин</h2>
                        <input type="hidden" id="editIndex" value="-1">
                        <div class="form-group"><label>Заголовок</label><input type="text" id="newsTitle"></div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group"><label>ID</label><input type="text" id="newsId"></div>
                            <div class="form-group"><label>Дата</label><input type="text" id="newsDate"></div>
                        </div>
                        <div class="form-group"><label>Картинка (URL)</label><input type="text" id="newsImage"></div>
                        <!-- Image Upload UI -->
                        <div
                            style="background: var(--vp-c-bg-soft); padding: 16px; border-radius: 8px; border: 1px dashed var(--vp-c-brand); margin-bottom: 20px;">
                            <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--vp-c-text-1);">Завантаження
                                зображень (GitHub)</h4>
                            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
                            <button onclick="uploadTarget='cover'; document.getElementById('fileInput').click()"
                                class="btn btn-outline" style="width: 100%; font-size: 13px;"><i
                                    class="fas fa-camera"></i> Вибрати
                                файл...</button>
                            <div id="uploadStatus" style="font-size: 12px; margin-top: 8px; color: var(--vp-c-text-2);">
                            </div>
                        </div>
                        <div class="form-group"><label>Короткий опис</label><textarea id="newsSummary"
                                rows="3"></textarea></div>
                        <div class="form-group"><label>Теги</label><input type="text" id="newsTags"></div>
                        <div class="form-group"><label>Теги</label><input type="text" id="newsTags"></div>
                        <div class="form-group">
                            <label>Текст</label>
                            <div class="editor-toolbar">
                                <button class="editor-btn" onclick="insertTag('<b>', '</b>')"><i
                                        class="fas fa-bold"></i></button>
                                <button class="editor-btn" onclick="insertTag('<i>', '</i>')"><i
                                        class="fas fa-italic"></i></button>
                                <button class="editor-btn" onclick="insertTag('<u>', '</u>')"><i
                                        class="fas fa-underline"></i></button>
                                <button class="editor-btn" onclick="insertTag('<h2>', '</h2>')">H2</button>
                                <button class="editor-btn" onclick="insertTag('<h3>', '</h3>')">H3</button>
                                <button class="editor-btn" onclick="insertTag('<p>', '</p>')">P</button>
                                <button class="editor-btn" onclick="insertTag('<br>', '')">BR</button>
                                <button class="editor-btn" onclick="createLink()"><i class="fas fa-link"></i></button>
                                <button class="editor-btn"
                                    onclick="uploadTarget='content'; document.getElementById('fileInput').click()"><i
                                        class="fas fa-image"></i></button>
                                <button class="editor-btn" onclick="insertTag('<ul>\n<li>', '</li>\n</ul>')"><i
                                        class="fas fa-list-ul"></i></button>
                            </div>
                            <textarea id="newsContent" rows="12"></textarea>
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button onclick="saveLocalNews()" class="btn btn-primary" style="flex: 1;">Застосувати зміни
                                (Локально)</button>
                            <button onclick="clearNewsForm()" class="btn btn-outline">Очистити</button>
                        </div>
                    </div>
                    <div>
                        <h2 style="margin-bottom: 24px;">Список новин</h2>
                        <div id="newsList"
                            style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATRONS SECTION -->
            <div id="patronsSection" class="section-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="margin-bottom: 24px;">Додати Мецената</h2>
                        <input type="hidden" id="pIndex" value="-1">
                        <div class="form-group"><label>Ім'я / Нікнейм</label><input type="text" id="pName"></div>
                        <div class="form-group"><label>Сума (наприклад: 500 ₴)</label><input type="text" id="pAmount">
                        </div>
                        <div class="form-group"><label>Повідомлення</label><textarea id="pMessage" rows="3"></textarea>
                        </div>
                        <div class="form-group"><label>Дата</label><input type="text" id="pDate"></div>
                        <div style="display: flex; gap: 12px;">
                            <button onclick="saveLocalPatron()" class="btn btn-primary" style="flex: 1;">Додати /
                                Оновити</button>
                            <button onclick="clearPatronForm()" class="btn btn-outline">Очистити</button>
                        </div>
                    </div>
                    <div>
                        <h2 style="margin-bottom: 24px;">Список Меценатів</h2>
                        <div id="patronsList"
                            style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // STATE
        let newsData = [];
        let patronsData = [];
        let newsSha = null;
        let patronsSha = null;
        let currentTab = 'news';
        let uploadTarget = 'cover';

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            const u = localStorage.getItem('gh_user');
            const r = localStorage.getItem('gh_repo');
            const t = localStorage.getItem('gh_token');
            if (u && r && t) {
                document.getElementById('ghUserIn').value = u;
                document.getElementById('ghRepoIn').value = r;
                document.getElementById('ghTokenIn').value = t;
            }
            document.getElementById('newsDate').value = new Date().toLocaleDateString('uk-UA');
            document.getElementById('pDate').value = new Date().toLocaleDateString('uk-UA');
        });

        // TABS
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Section').classList.add('active');

            // Auto reload data for tab if empty
            if (tab === 'news' && newsData.length === 0) loadTabFile('news.json');
            if (tab === 'patrons' && patronsData.length === 0) loadTabFile('patrons.json');
        }

        // AUTH
        async function authenticateGithub() {
            const user = document.getElementById('ghUserIn').value.trim();
            const repo = document.getElementById('ghRepoIn').value.trim();
            const token = document.getElementById('ghTokenIn').value.trim();
            if (!user || !repo || !token) return alert('Fill all fields');

            localStorage.setItem('gh_user', user);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);
            document.getElementById('authOverlay').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('displayUser').innerText = user;
            loadFromGitHub();
        }
        function logout() { localStorage.removeItem('gh_token'); location.reload(); }

        // API
        async function loadFromGitHub() {
            const file = currentTab === 'news' ? 'news.json' : 'patrons.json';
            const status = document.getElementById('statusMsg');
            status.innerText = `Завантаження ${file}...`;

            try {
                const data = await fetchFile(file);
                if (currentTab === 'news') {
                    newsData = JSON.parse(data.content);
                    newsSha = data.sha;
                    renderNews();
                } else {
                    patronsData = JSON.parse(data.content);
                    patronsSha = data.sha;
                    renderPatrons();
                }
                status.innerText = `✅ ${file} завантажено`;
            } catch (e) {
                status.innerText = `❌ Помилка: ${e.message}`;
                // If 404, assume new
                if (e.message.includes('404')) {
                    if (currentTab === 'news') newsData = [];
                    else patronsData = [];
                    status.innerText = 'Створіть новий файл...';
                }
            }
        }

        async function fetchFile(path) {
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            // Add cache buster to prevent loading stale deleted data
            const url = `https://api.github.com/repos/${user}/${repo}/contents/${path}?t=${Date.now()}`;
            const res = await fetch(url, { headers: { 'Authorization': `token ${token}` } });
            if (!res.ok) throw new Error(res.status);
            const json = await res.json();
            return {
                sha: json.sha,
                content: decodeURIComponent(escape(window.atob(json.content)))
            };
        }

        async function pushToGitHub() {
            const file = currentTab === 'news' ? 'news.json' : 'patrons.json';
            const data = currentTab === 'news' ? newsData : patronsData;
            const sha = currentTab === 'news' ? newsSha : patronsSha;

            const status = document.getElementById('statusMsg');
            status.innerText = `Збереження ${file}...`;

            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            const contentStr = JSON.stringify(data, null, 4);
            const contentBase64 = window.btoa(unescape(encodeURIComponent(contentStr)));

            try {
                const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${file}`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Update ${file}`,
                        content: contentBase64,
                        sha: sha
                    })
                });
                if (!res.ok) throw new Error('Save failed');
                const json = await res.json();

                if (currentTab === 'news') newsSha = json.content.sha;
                else patronsSha = json.content.sha;

                status.innerText = `✅ ${file} збережено!`;
            } catch (e) { status.innerText = `Error: ${e.message}`; }
        }

        // NEWS CRUD
        function insertTag(start, end) {
            const textarea = document.getElementById('newsContent');
            const s = textarea.selectionStart;
            const e = textarea.selectionEnd;
            const text = textarea.value;
            textarea.value = text.substring(0, s) + start + text.substring(s, e) + end + text.substring(e);
        }
        function createLink() {
            const url = prompt('Enter URL:');
            if (url) insertTag(`<a href="${url}">`, '</a>');
        }

        function saveLocalNews() {
            const title = document.getElementById('newsTitle').value.trim();
            if (!title) return alert('Введіть заголовок!');

            const item = {
                id: document.getElementById('newsId').value || `post-${Date.now()}`,
                title: title,
                date: document.getElementById('newsDate').value,
                image: document.getElementById('newsImage').value || 'assets/images/logo_new.png',
                summary: document.getElementById('newsSummary').value,
                fullContent: document.getElementById('newsContent').value,
                tags: document.getElementById('newsTags').value.split(',')
            };
            const idx = parseInt(document.getElementById('editIndex').value);
            if (idx >= 0) newsData[idx] = item; else newsData.push(item);
            renderNews(); clearNewsForm();
        }
        function renderNews() {
            const l = document.getElementById('newsList'); l.innerHTML = '';
            newsData.forEach((i, idx) => {
                l.innerHTML += `<div class="list-item"><b>${i.title}</b> <div><button onclick="editNews(${idx})">✏️</button> <button onclick="delNews(${idx})">🗑️</button></div></div>`;
            });
        }
        function editNews(i) {
            const d = newsData[i];
            document.getElementById('newsTitle').value = d.title; document.getElementById('newsId').value = d.id;
            document.getElementById('newsContent').value = d.fullContent; document.getElementById('editIndex').value = i;
            document.getElementById('newsImage').value = d.image;
        }
        function delNews(i) { newsData.splice(i, 1); renderNews(); }
        function clearNewsForm() { document.getElementById('newsTitle').value = ''; document.getElementById('editIndex').value = '-1'; }

        // PATRONS CRUD
        function saveLocalPatron() {
            const item = {
                name: document.getElementById('pName').value,
                amount: document.getElementById('pAmount').value,
                message: document.getElementById('pMessage').value,
                date: document.getElementById('pDate').value
            };
            const idx = parseInt(document.getElementById('pIndex').value);
            if (idx >= 0) patronsData[idx] = item; else patronsData.push(item);
            renderPatrons(); clearPatronForm();
        }
        function renderPatrons() {
            const l = document.getElementById('patronsList'); l.innerHTML = '';
            patronsData.forEach((i, idx) => {
                l.innerHTML += `<div class="list-item"><div><b>${i.name}</b> (${i.amount})</div> <div><button onclick="editPatron(${idx})">✏️</button> <button onclick="delPatron(${idx})">🗑️</button></div></div>`;
            });
        }
        function editPatron(i) {
            const d = patronsData[i];
            document.getElementById('pName').value = d.name; document.getElementById('pAmount').value = d.amount;
            document.getElementById('pMessage').value = d.message; document.getElementById('pDate').value = d.date;
            document.getElementById('pIndex').value = i;
        }
        function delPatron(i) { patronsData.splice(i, 1); renderPatrons(); }
        function clearPatronForm() { document.getElementById('pName').value = ''; document.getElementById('pAmount').value = ''; document.getElementById('pMessage').value = ''; document.getElementById('pIndex').value = '-1'; }
        async function loadTabFile(f) { loadFromGitHub(); }

        // Upload (Same as before)
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const status = document.getElementById('uploadStatus');
            status.innerHTML = 'Uploading...';
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const contentBase64 = reader.result.split(',')[1];
                const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const path = `assets/images/uploads/${Date.now()}_${cleanName}`;
                try {
                    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: 'upload', content: contentBase64 })
                    });
                    status.innerHTML = `Done! Path: ${path}`;

                    if (uploadTarget === 'cover') {
                        document.getElementById('newsImage').value = path;
                    } else {
                        const imgTag = `<img src="${path}" alt="Image" style="width:100%; border-radius:8px; margin: 16px 0;">`;
                        insertTag(imgTag, '');
                    }
                } catch (e) { status.innerHTML = 'Error'; }
            };
        }
    </script>
</body>

</html>
