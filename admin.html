<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ОБРІЙ Admin</title>
    <link rel="icon" type="image/png" href="assets/images/logo_new.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=2.2">
    <style>
        body {
            padding-top: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            background: var(--vp-c-bg);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .admin-panel {
            display: none;
            padding: 40px 0;
            flex: 1;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--vp-c-text-2);
            font-size: 13px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--vp-c-brand);
            outline: none;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: var(--vp-c-bg-alt);
            border: 1px solid var(--vp-c-border);
            border-radius: 8px;
        }

        .editor-btn {
            background: var(--vp-c-bg);
            border: 1px solid var(--vp-c-border);
            color: var(--vp-c-text-1);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-btn:hover {
            border-color: var(--vp-c-brand);
            color: var(--vp-c-brand);
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: var(--vp-c-bg-alt);
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid var(--vp-c-border);
        }

        .preview-box {
            padding: 24px;
            background: var(--vp-c-bg-alt);
            border-radius: 12px;
            border: 1px solid var(--vp-c-border);
            margin-top: 24px;
            min-height: 200px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: var(--vp-c-bg-alt);
            border-radius: 16px;
            border: 1px solid var(--vp-c-border);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--vp-c-border);
            padding-bottom: 1px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            color: var(--vp-c-text-2);
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--vp-c-brand);
            border-bottom-color: var(--vp-c-brand);
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        /* Override global header styles for Admin to prevent layer issues */
        .admin-panel header {
            position: static;
            height: auto;
            background: transparent;
            border-bottom: none;
            backdrop-filter: none;
        }

        /* Quill Editor Dark Mode Overrides */
        .ql-toolbar.ql-snow {
            border-color: var(--vp-c-border) !important;
            background: var(--vp-c-bg-soft);
        }
        .ql-container.ql-snow {
            border-color: var(--vp-c-border) !important;
            background: var(--vp-c-bg-alt);
            color: var(--vp-c-text-1);
            font-family: 'Inter', sans-serif !important;
            font-size: 16px;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }
        .ql-toolbar.ql-snow .ql-stroke {
            stroke: var(--vp-c-text-2) !important;
        }
        .ql-toolbar.ql-snow .ql-fill {
            fill: var(--vp-c-text-2) !important;
        }
        .ql-toolbar.ql-snow .ql-picker {
            color: var(--vp-c-text-2) !important;
        }
        
        /* Preview Modal */
        .preview-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: none;
            overflow-y: auto;
            padding: 40px 20px;
        }
        .preview-content {
            background: var(--vp-c-bg); /* Use site bg */
            max-width: 900px;
            margin: 0 auto;
            border-radius: 12px;
            position: relative;
        }
    </style>
    <!-- Quill CDN -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
</head>

<body>

    <!-- Auth Overlay -->
    <div class="login-overlay" id="authOverlay">
        <div class="login-box">
            <div style="text-align: center; margin-bottom: 24px;">
                <img src="assets/images/logo_new.png" alt="Logo" style="height: 50px; margin-bottom: 16px;">
                <h2>Вхід в Адмінку</h2>
                <p style="color: var(--vp-c-text-2); font-size: 14px;">Введіть пароль адміністратора</p>
            </div>
            
            <div class="form-group">
                <label>Admin Password</label>
                <input type="password" id="adminPass" placeholder="••••••••">
            </div>
            


            <button onclick="authenticateGithub()" class="btn btn-primary" id="loginBtn" style="width: 100%;">Увійти</button>
            <p id="authError" style="color: #ff4d4d; margin-top: 16px; text-align: center; display: none;"></p>
        </div>
    </div>

    <!-- Main Interface -->
    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <header style="margin-bottom: 32px; display: flex; justify-content: space-between; align-items: center;">
                <div class="logo">
                    <img src="assets/images/logo_new.png" alt="Logo">
                    <span style="font-weight:700; font-size:20px;">ADMIN</span>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="text-align: right; font-size: 13px; color: var(--vp-c-text-2);">
                        <div id="displayUser">User</div>
                        <div id="displayRepo" style="opacity: 0.7;">Repo</div>
                    </div>
                    <button onclick="logout()" class="btn btn-outline"
                        style="border-color: #ff4d4d33; color: #ff4d4d;">Вийти</button>
                    <a href="index.html" class="btn btn-outline">На сайт</a>
                </div>
            </header>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('news')">Новини</button>
                <button class="tab-btn" onclick="switchTab('patrons')">Меценати (Донати)</button>
            </div>

            <!-- Global Actions -->
            <div
                style="margin-bottom: 24px; padding: 16px; background: var(--vp-c-bg-soft); border-radius: 12px; display: flex; gap: 16px; align-items: center;">
                <button onclick="loadFromGitHub()" class="btn btn-outline"><i class="fas fa-sync"></i> Оновити поточну
                    вкладку</button>
                <div style="flex:1; text-align:center; color: var(--vp-c-text-3); font-size: 14px;" id="statusMsg">
                    Готовий до роботи</div>
                <button onclick="pushToGitHub()" class="btn btn-primary" style="background: #2ea44f; color: white;"><i
                        class="fas fa-cloud-upload-alt"></i> Зберегти поточну вкладку</button>
            </div>

            <!-- NEWS SECTION -->
            <div id="newsSection" class="section-content active">
                <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px;">
                    <div>
                        <h2 style="margin-bottom: 24px;">Редактор Новин</h2>
                        <input type="hidden" id="editIndex" value="-1">
                        <div class="form-group"><label>Заголовок</label><input type="text" id="newsTitle"></div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group"><label>ID</label><input type="text" id="newsId"></div>
                            <div class="form-group"><label>Дата</label><input type="text" id="newsDate"></div>
                        </div>
                        <div class="form-group"><label>Картинка (URL)</label><input type="text" id="newsImage"></div>
                        <!-- Image Upload UI -->
                        <div
                            style="background: var(--vp-c-bg-soft); padding: 16px; border-radius: 8px; border: 1px dashed var(--vp-c-brand); margin-bottom: 20px;">
                            <h4 style="margin-bottom: 12px; font-size: 14px; color: var(--vp-c-text-1);">Завантаження
                                зображень (GitHub)</h4>
                            <input type="file" id="fileInput" style="display: none;" onchange="uploadFile()">
                            <button onclick="uploadTarget='cover'; document.getElementById('fileInput').click()"
                                class="btn btn-outline" style="width: 100%; font-size: 13px;"><i
                                    class="fas fa-camera"></i> Вибрати
                                файл...</button>
                            <div id="uploadStatus" style="font-size: 12px; margin-top: 8px; color: var(--vp-c-text-2);">
                            </div>
                        </div>
                        <div class="form-group"><label>Короткий опис</label><textarea id="newsSummary"
                                rows="3"></textarea></div>
                        <div class="form-group"><label>Теги</label><input type="text" id="newsTags"></div>
                        <div class="form-group">
                            <label>Текст (Візуальний редактор)</label>
                            <!-- Quill Editor Container -->
                            <div id="editor-container" style="height: 400px;"></div>
                            <input type="hidden" id="newsContent"> <!-- Hidden input to store value for strict compatibility if needed, though we use JS var -->
                        </div>
                        <div style="display: flex; gap: 12px;">
                            <button onclick="showPreview()" class="btn btn-outline" style="border-color: var(--vp-c-brand); color: var(--vp-c-brand);"><i class="fas fa-eye"></i> Попередній перегляд</button>
                            <button onclick="saveLocalNews()" class="btn btn-primary" style="flex: 1;">Застосувати зміни
                                (Локально)</button>
                            <button onclick="clearNewsForm()" class="btn btn-outline">Очистити</button>
                        </div>
                    </div>
                    <div>
                        <h2 style="margin-bottom: 24px;">Список новин</h2>
                        <div id="newsList"
                            style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        </div>
                    </div>
                </div>
            </div>

            <!-- PATRONS SECTION -->
            <div id="patronsSection" class="section-content">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                    <div>
                        <h2 style="margin-bottom: 24px;">Додати Мецената</h2>
                        <input type="hidden" id="pIndex" value="-1">
                        <div class="form-group"><label>Ім'я / Нікнейм</label><input type="text" id="pName"></div>
                        <div class="form-group"><label>Сума (наприклад: 500 ₴)</label><input type="text" id="pAmount">
                        </div>
                        <div class="form-group"><label>Повідомлення</label><textarea id="pMessage" rows="3"></textarea>
                        </div>
                        <div class="form-group"><label>Дата</label><input type="text" id="pDate"></div>
                        <div style="display: flex; gap: 12px;">
                            <button onclick="saveLocalPatron()" class="btn btn-primary" style="flex: 1;">Додати /
                                Оновити</button>
                            <button onclick="clearPatronForm()" class="btn btn-outline">Очистити</button>
                        </div>
                    </div>

                    <div>
                        <h2 style="margin-bottom: 24px;">Список Меценатів</h2>
                        <div id="patronsList"
                            style="max-height: 500px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // STATE
        let newsData = [];
        let patronsData = [];
        let newsSha = null;
        let patronsSha = null;
        let currentTab = 'news';
        let uploadTarget = 'cover';
        let quill; // Quill instance

        // INIT
        document.addEventListener('DOMContentLoaded', () => {
            // Init Quill
            quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        ['link', 'image', 'video'],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['clean']
                    ]
                }
            });

            // Custom Image Handler for Quill to use GitHub upload
            const toolbar = quill.getModule('toolbar');
            toolbar.addHandler('image', () => {
                uploadTarget = 'content-quill';
                document.getElementById('fileInput').click();
            });

            const u = localStorage.getItem('admin_pass');
            if (u) {
                document.getElementById('adminPass').value = u;
            }
            document.getElementById('newsDate').value = new Date().toLocaleDateString('uk-UA');
            document.getElementById('pDate').value = new Date().toLocaleDateString('uk-UA');
        });

        // ... existing TABS ...
        function switchTab(tab) {
             // ... existing logic ...
             if (tab === 'news') {
                 // Refresh height check or something if needed
             }
             currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tab + 'Section').classList.add('active');

            if (tab === 'news' && newsData.length === 0) loadTabFile('news.json');
            if (tab === 'patrons' && patronsData.length === 0) loadTabFile('patrons.json');
        }
        // ... existing AUTH ...
        // CONSTANTS
        const WORKER_URL = 'https://adminpanel.bodyagavril.workers.dev';

        // AUTH
        async function authenticateGithub() {
            const pass = document.getElementById('adminPass').value.trim();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('authError');
            
            if (!pass) return alert('Введіть пароль');

            // UI Loading state
            btn.disabled = true;
            btn.innerText = 'Перевірка...';
            errorMsg.style.display = 'none';

            try {
                // Try to fetch news.json just to validate password/IP
                const res = await fetch(`${WORKER_URL}?path=news.json`, {
                    headers: { 'x-admin-password': pass }
                });

                if (res.status === 401) {
                    throw new Error('Неправильний пароль');
                }
                if (res.status === 403) {
                    throw new Error('Забагато спроб. Спробуйте через 20 хв.');
                }
                if (!res.ok) {
                    throw new Error('Помилка з\'єднання');
                }

                // Success
                localStorage.setItem('admin_pass', pass);
                
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('displayUser').innerText = 'Admin';
                document.getElementById('displayRepo').innerText = 'Secure Mode';
                
                loadFromGitHub();

            } catch (e) {
                errorMsg.innerText = e.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Увійти';
            }
        }

        function logout() { 
            localStorage.removeItem('admin_pass'); 
            location.reload(); 
        }

        // API
        async function loadFromGitHub() {
            const file = currentTab === 'news' ? 'news.json' : 'patrons.json';
            const status = document.getElementById('statusMsg');
            status.innerText = `Завантаження ${file}...`;

            const pass = localStorage.getItem('admin_pass');

            try {
                const res = await fetch(`${WORKER_URL}?path=${file}`, {
                    headers: { 'x-admin-password': pass }
                });

                if (!res.ok) throw new Error(await res.text());
                const json = await res.json(); 
                
                // Decode content
                const content = decodeURIComponent(escape(window.atob(json.content)));
                
                if (currentTab === 'news') {
                    newsData = JSON.parse(content);
                    newsSha = json.sha;
                    renderNews();
                } else {
                    patronsData = JSON.parse(content);
                    patronsSha = json.sha;
                    renderPatrons();
                }
                status.innerText = `✅ ${file} завантажено`;
            } catch (e) {
                console.error(e);
                status.innerText = `❌ Помилка: ${e.message}`;
                // If 404/Empty, init empty
                if (currentTab === 'news' && !newsData.length) newsData = [];
                if (currentTab === 'patrons' && !patronsData.length) patronsData = [];
            }
        }

        async function pushToGitHub() {
            const file = currentTab === 'news' ? 'news.json' : 'patrons.json';
            const data = currentTab === 'news' ? newsData : patronsData;
            const sha = currentTab === 'news' ? newsSha : patronsSha;

            const status = document.getElementById('statusMsg');
            status.innerText = `Збереження ${file}...`;

            const pass = localStorage.getItem('admin_pass');

            const contentStr = JSON.stringify(data, null, 4);
            const contentBase64 = window.btoa(unescape(encodeURIComponent(contentStr)));

            try {
                const res = await fetch(`${WORKER_URL}?path=${file}`, {
                    method: 'PUT',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-password': pass
                    },
                    body: JSON.stringify({
                        message: `Update ${file} via Admin Panel`,
                        content: contentBase64,
                        sha: sha
                    })
                });

                if (!res.ok) throw new Error(await res.text());
                const json = await res.json();

                if (currentTab === 'news') newsSha = json.content.sha;
                else patronsSha = json.content.sha;

                status.innerText = `✅ ${file} збережено! (Зачекайте 1-2 хв для оновлення сайту)`;
            } catch (e) { status.innerText = `Error: ${e.message}`; }
        }

        // NEWS CRUD
        function saveLocalNews() {
            const title = document.getElementById('newsTitle').value.trim();
            if (!title) return alert('Введіть заголовок!');

            const item = {
                id: document.getElementById('newsId').value || `post-${Date.now()}`,
                title: title,
                date: document.getElementById('newsDate').value,
                image: document.getElementById('newsImage').value || 'assets/images/logo_new.png',
                summary: document.getElementById('newsSummary').value,
                fullContent: quill.root.innerHTML, // GET CONTENT FROM QUILL
                tags: document.getElementById('newsTags').value.split(',').map(t => t.trim()).filter(t => t.length > 0)
            };
            const idx = parseInt(document.getElementById('editIndex').value);
            if (idx >= 0) newsData[idx] = item; else newsData.push(item);
            renderNews(); clearNewsForm();
        }
        function renderNews() {
            const l = document.getElementById('newsList'); l.innerHTML = '';
            newsData.forEach((i, idx) => {
                l.innerHTML += `<div class="list-item"><b>${i.title}</b> <div><button onclick="editNews(${idx})">✏️</button> <button onclick="delNews(${idx})">🗑️</button></div></div>`;
            });
        }
        function editNews(i) {
            const d = newsData[i];
            console.log('Editing post:', d); // Debugging
            
            document.getElementById('newsTitle').value = d.title || '';
            document.getElementById('newsId').value = d.id || '';
            
            // Try different keys for content, just in case
            // script.js uses: item.fullContent || item.summary
            let contentToLoad = d.fullContent || d.content || d.body || d.text || '';
            
            // If main content is empty but summary exists and seems long, maybe that's it?
            if (!contentToLoad && d.summary && d.summary.length > 100) {
                contentToLoad = d.summary;
            }

            if (quill) {
                // Use clipboard for safer HTML insertion
                quill.clipboard.dangerouslyPasteHTML(contentToLoad);
            }
            
            document.getElementById('editIndex').value = i;
            document.getElementById('newsImage').value = d.image || '';
        }
        function delNews(i) { newsData.splice(i, 1); renderNews(); }
        function clearNewsForm() { 
            document.getElementById('newsTitle').value = ''; 
            document.getElementById('editIndex').value = '-1'; 
            quill.root.innerHTML = ''; // Clear Quill
        }

        // PATRONS CRUD
        function saveLocalPatron() {
            const item = {
                name: document.getElementById('pName').value,
                amount: document.getElementById('pAmount').value,
                message: document.getElementById('pMessage').value,
                date: document.getElementById('pDate').value
            };
            const idx = parseInt(document.getElementById('pIndex').value);
            if (idx >= 0) patronsData[idx] = item; else patronsData.push(item);
            renderPatrons(); clearPatronForm();
        }
        function renderPatrons() {
            const l = document.getElementById('patronsList'); l.innerHTML = '';
            patronsData.forEach((i, idx) => {
                l.innerHTML += `<div class="list-item"><div><b>${i.name}</b> (${i.amount})</div> <div><button onclick="editPatron(${idx})">✏️</button> <button onclick="delPatron(${idx})">🗑️</button></div></div>`;
            });
        }
        function editPatron(i) {
            const d = patronsData[i];
            document.getElementById('pName').value = d.name; document.getElementById('pAmount').value = d.amount;
            document.getElementById('pMessage').value = d.message; document.getElementById('pDate').value = d.date;
            document.getElementById('pIndex').value = i;
        }
        function delPatron(i) { patronsData.splice(i, 1); renderPatrons(); }
        function clearPatronForm() { document.getElementById('pName').value = ''; document.getElementById('pAmount').value = ''; document.getElementById('pMessage').value = ''; document.getElementById('pIndex').value = '-1'; }
        async function loadTabFile(f) { loadFromGitHub(); }

        // Upload (Same as before)
        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            if (!file) return;
            const user = localStorage.getItem('gh_user');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');
            const status = document.getElementById('uploadStatus');
            status.innerHTML = 'Uploading...';
            
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function () {
                const contentBase64 = reader.result.split(',')[1];
                const cleanName = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const path = `assets/images/uploads/${Date.now()}_${cleanName}`;
                
                try {
                    // 1. Upload to GitHub
                    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: 'upload', content: contentBase64 })
                    });
                    
                    // 2. Get Default Branch (for Raw URL)
                    let branch = 'main';
                    try {
                        const repoRes = await fetch(`https://api.github.com/repos/${user}/${repo}`, {
                             headers: { 'Authorization': `token ${token}` }
                        });
                        const repoJson = await repoRes.json();
                        if (repoJson.default_branch) branch = repoJson.default_branch;
                    } catch (e) { console.warn('Could not detect branch, defaulting to main'); }

                    // 3. Construct Raw URL (Works immediately-ish)
                    const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${path}`;
                    status.innerHTML = `Done!`;

                    if (uploadTarget === 'cover') {
                        document.getElementById('newsImage').value = rawUrl;
                    } else if (uploadTarget === 'content-quill') {
                        // Insert image into Quill cursor position
                        const range = quill.getSelection();
                        quill.insertEmbed(range ? range.index : 0, 'image', rawUrl);
                    } else {
                        // Fallback
                        // const imgTag = `<img src="${rawUrl}" alt="Image" style="width:100%; border-radius:8px; margin: 16px 0;">`;
                    }
                } catch (e) { status.innerHTML = 'Error: ' + e.message; }
            };
        }
    </script>

    <script>
        // ... (existing download functions if any)

        function showPreview() {
            const title = document.getElementById('newsTitle').value || 'Без заголовка';
            const date = document.getElementById('newsDate').value || '01.01.2024';
            const image = document.getElementById('newsImage').value;
            const content = quill.root.innerHTML;
            const tags = document.getElementById('newsTags').value.split(',').filter(t => t.trim().length > 0);

            const container = document.getElementById('previewContainer');
            
            // Build HTML structure mimicking article.html
            let tagsHtml = tags.map(t => `<span class="tag" style="margin-left:12px; color: var(--vp-c-brand); font-weight:600;">#${t.trim()}</span>`).join('');
            
            let html = `
                <div class="full-article"> <!-- Use CSS class styling -->
                    <div class="article-header" style="margin-bottom: 32px;">
                        <h1 style="font-size: 36px; margin-top:16px; margin-bottom:16px;">${title}</h1>
                        <div class="news-meta" style="margin-bottom: 16px; color: var(--vp-c-text-2);">
                            <span><i class="far fa-calendar-alt"></i> ${date}</span>
                            ${tagsHtml}
                        </div>
                        ${image ? `<div class="news-image" style="height: 400px; border-radius: 12px; margin-bottom: 24px; overflow:hidden;"><img src="${image}" style="width: 100%; height: 100%; object-fit: cover;"></div>` : ''}
                    </div>
                    <div class="article-content" style="font-size: 18px; line-height: 1.8; color: var(--vp-c-text-1);">
                        ${content}
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            document.getElementById('previewOverlay').style.display = 'block';
            document.body.style.overflow = 'hidden'; // Stop scrolling background
        }

        function closePreview() {
            document.getElementById('previewOverlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
